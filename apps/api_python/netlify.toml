[build]
  command = "pip install -r requirements.txt"
  publish = "public"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  included_files = ["**/*.py"]

[[redirects]]
  from = "/health/db"
  to = "/health-db.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
