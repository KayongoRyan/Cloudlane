server {
    listen 80;
    server_name e2e-gw-1787431526888-13fc-default.gateway.cloudlane.run;

    location = /internal/gateway/auth {
        internal;
        proxy_pass http://gateway-auth/internal/gateway/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Gateway-Hostname $host;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;
    }


    location = "/" {
        limit_except GET {
            deny all;
        }
        auth_request /internal/gateway/auth;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Cloudlane-Gateway-Id "6a8a0a69d848f75e44fe47ca";
        proxy_set_header X-Cloudlane-Route-Id "6a8a0a69d848f75e44fe47cc";
        proxy_pass https://e2e-app-1787431526888-ea3504.cloudlane.run;
    }

}
