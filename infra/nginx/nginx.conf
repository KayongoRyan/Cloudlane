worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/lb-stream/*.conf;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 128;

    map $request_id $request_id_final {
        default $request_id;
        "" $request_id;
    }

    log_format gateway '$remote_addr - $host "$request" $status '
                     '"$http_x_api_key" rt=$request_time rid=$request_id_final';

    access_log /var/log/nginx/access.log gateway;

    upstream gateway-auth {
        server host.docker.internal:8001;
    }

    include /etc/nginx/gateways/*.conf;
    include /etc/nginx/lbs/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        return 404 "Cloudlane gateway-proxy — no matching hostname";
    }
}
