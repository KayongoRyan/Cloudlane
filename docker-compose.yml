services:
  mongo:
    image: mongo:7
    container_name: cloudlane-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cloudlane
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cloudlane}
    volumes:
      - cloudlane_mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: cloudlane-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    environment:
      MINIO_ROOT_USER: cloudlane
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cloudlane-secret}
    volumes:
      - cloudlane_minio_data:/data

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: cloudlane-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cloudlane_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: cloudlane-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cloudlane}
    volumes:
      - cloudlane_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: cloudlane-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - cloudlane_redis_data:/data

  # Tenant managed SQL (RDS product) — separate from control-plane Mongo
  managed-postgres:
    image: postgres:16-alpine
    container_name: cloudlane-managed-postgres
    ports:
      - "${MANAGED_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${MANAGED_POSTGRES_ADMIN_USER:-cloudlane_rds}
      POSTGRES_PASSWORD: ${MANAGED_POSTGRES_ADMIN_PASSWORD:-cloudlane-rds}
      POSTGRES_DB: postgres
    volumes:
      - cloudlane_managed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10

  managed-mysql:
    image: mysql:8.0
    container_name: cloudlane-managed-mysql
    ports:
      - "${MANAGED_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MANAGED_MYSQL_ADMIN_PASSWORD:-cloudlane-rds}
    volumes:
      - cloudlane_managed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 15

  gateway-proxy:
    image: nginx:1.27-alpine
    container_name: cloudlane-gateway-proxy
    ports:
      - "8080:80"
      - "8443:443"
      - "19400-19599:19400-19599"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/gateways:/etc/nginx/gateways:ro
      - ./infra/nginx/lbs:/etc/nginx/lbs:ro
      - ./infra/nginx/lbs/certs:/etc/nginx/lbs/certs:ro
      - ./infra/nginx/lb-stream:/etc/nginx/lb-stream:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  provision-worker:
    image: python:3.13-slim
    container_name: cloudlane-provision-worker
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && python worker.py"
    volumes:
      - ./apps/api_python:/app
      - ./infra/nginx/gateways:/app/infra/nginx/gateways
      - ./infra/nginx/lbs:/app/infra/nginx/lbs
      - ./infra/nginx/lbs/certs:/app/infra/nginx/lbs/certs
      - ./infra/nginx/lb-stream:/app/infra/nginx/lb-stream
    environment:
      DATABASE_URL: mongodb://cloudlane:${MONGO_PASSWORD:-cloudlane}@mongo:27017/cloudlane?authSource=admin
      BASE_DOMAIN: ${BASE_DOMAIN:-cloudlane.run}
      GATEWAY_CONFIG_DIR: infra/nginx/gateways
      LB_CONFIG_DIR: infra/nginx/lbs
      LB_STREAM_CONFIG_DIR: infra/nginx/lb-stream
      LB_TLS_CERT_DIR: infra/nginx/lbs/certs
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2}
      PROVISION_MAX_ATTEMPTS: ${PROVISION_MAX_ATTEMPTS:-3}
    depends_on:
      - mongo

volumes:
  cloudlane_mongo_data:
  cloudlane_minio_data:
  cloudlane_prometheus_data:
  cloudlane_grafana_data:
  cloudlane_redis_data:
  cloudlane_managed_postgres_data:
  cloudlane_managed_mysql_data:
